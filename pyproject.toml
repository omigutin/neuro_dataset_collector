[project]
name = "neuro-dataset-collector"
version = "0.2.0"
description = "Сбор и раскладка кадров из видео для обучения нейросетей: по правилам, вручную и с историей."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "omigutin", email = "migutin83@yandex.ru" }]
requires-python = ">=3.10,<4.0"
keywords = ["dataset", "computer-vision", "frames", "video", "yolo", "roboflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.5,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# OpenCV не обязателен: в проекте-хозяине может уже стоять opencv-python,
# а одновременная установка с opencv-python-headless ломает cv2.
opencv = ["opencv-python>=4.8"]
headless = ["opencv-python-headless>=4.8"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
ndc = "neuro_dataset_collector.cli.main:main"

[tool.poetry]
packages = [{ include = "neuro_dataset_collector", from = "src" }]
include = [{ path = "src/neuro_dataset_collector/web/static/*", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.5"
mypy = ">=1.10"
types-pyyaml = ">=6.0"
httpx = ">=0.27"
opencv-python-headless = ">=4.8"
fastapi = ">=0.110"
uvicorn = ">=0.27"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
files = ["src/neuro_dataset_collector"]
