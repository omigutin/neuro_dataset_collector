# Пример настроек neuro_frame_collector.
# Все пути можно писать относительно этого файла.

# Для какой задачи собираем кадры: classify (классификация), detect (детекция), segment (сегментация).
task: classify

# Классы. Для классификации это названия папок.
classes: [EMPTY, FULL, NONE, UNKNOWN]

# Папка для кадров без класса (например, при первом сборе без модели).
unsorted_label: _unsorted

# Где хранить кадры и историю.
catalog:
  root: datasets                 # корневая папка; в ней же файл истории catalog.sqlite
  collection: myproject/line1    # группа кадров; можно любую глубину через «/» или просто default
  dedup_scope: collection        # где искать похожие кадры: collection (в этой группе) или catalog (везде)

# Зоны, которые вырезаются из кадра.
regions:
  source: none                   # none — весь кадр; file — из файла разметки LabelMe; api — передаёт программа
  file: null                     # путь к файлу LabelMe (для source: file)
  labels: []                     # какие фигуры брать по метке, например [crop]; пусто — все
  where: {}                      # дополнительный отбор по полям фигуры, например {position: left}
  id_field: null                 # поле фигуры, которое станет номером зоны, например wz
  mask_outside: false            # закрасить чёрным всё вне многоугольника
  padding: 0                     # отступ вокруг зоны в пикселях
  fallback_to_full_frame: true   # если файл зон не найден — сохранять весь кадр

# Ручное сохранение по клавишам (веб-интерфейс и программы-хозяева).
manual:
  keys: {"1": EMPTY, "2": FULL, "3": NONE, "4": UNKNOWN}
  save_all_key: s                # сохранить все зоны без класса
  on_duplicate: reject           # похожий кадр: reject — не сохранять, warn — сохранить с предупреждением, allow — молча

# Автоматический отбор: сохраняем, если сработал ЛЮБОЙ повод и пройдены ВСЕ ограничения.
auto:
  enabled: true
  triggers:
    - {type: confidence, min: 0.0, max: 0.8}   # модель сомневается
    - {type: audit, rate: 0.02}                # 2% случайных кадров — ловим уверенные ошибки
    # - {type: always}                         # каждый кадр — для первого сбора без модели
  limits:
    - {type: interval, seconds: 1}             # не чаще раза в секунду (для каждой зоны и класса)
    - {type: scene_change, min_diff: 6}        # картинка заметно изменилась с прошлого сохранения
    - {type: quota, per_label: 2000}           # не больше 2000 кадров на класс
    - {type: dedup, threshold: 5}              # без почти одинаковых картинок
  per_label: {}                                # свои правила для классов, например
                                               # {EMPTY: {enabled: false}, FULL: {max_conf: 0.9, interval_seconds: 5}}

# Проверка последовательности ответов модели (только классификация).
consistency:
  enabled: false
  context: 5                     # сколько одинаковых ответов нужно до и после выброса
  max_run: 2                     # выброс — не длиннее стольких кадров подряд
  review_always: [UNKNOWN]       # эти классы никогда не исправляются автоматически
  trusted_flips: {}              # автоисправление, например {EMPTY: [FULL]} — EMPTY среди FULL станет FULL

# Файлы.
storage:
  filename: "{source}_r{region}_f{frame:06d}"   # поля: source region frame label conf mode date time collection
  image_format: jpg
  jpeg_quality: 95
  keep_source_frame: false       # дополнительно сохранять полный кадр (в папку _frames)
  min_free_gb: 1.0               # не сохранять, если на диске меньше этого места

# Режим работы.
runtime:
  profile: dev                   # production — для боевого сервера: фоновая запись, лимит в час, отключение при ошибке
  async_write: true
  queue_size: 64
  max_saves_per_hour: null
  disable_on_error: false

# Видео для нарезки (команда nfc collect и веб-интерфейс).
source:
  path: null                     # файл или папка с видео
  extensions: [.mp4, .avi, .mov, .mkv]
  recursive: false
  step: 5                        # смотреть каждый 5-й кадр

# Модель для офлайн-сбора (нужен пакет ultralytics). Пусто — без модели.
model:
  path: null
  device: null
  conf: 0.05
